<html>
  <head>
    <meta charset="UTF-8">
    <title data-i18n="extName">TK Tree Style Tab Outliner</title>
    <script type="module" src="/common/i18n.js"></script>
    <script type="module" src="./view.js"></script>
    <link id="theme-base" rel="stylesheet" type="text/css" href="/themes/tk.css"/>
    <link id="theme-variant" rel="stylesheet" type="text/css" href="/themes/tk-night.css"/>
    <link rel="stylesheet" type="text/css" href="./sidepanel.css"/>
  </head>
  <body id="body" class="unfocused">
    <div id="top-area">
      <div id="top-bar" class="toolbar">
        <div id="view-scope-btn" class="button" data-i18n="btn_viewScope_session">
          Session
        </div>
        <div id="tree-view-in-tab-btn" class="button" data-i18n="btn_tab">
          Tab
        </div>
        <div id="undo-btn" class="button greyed-out" data-i18n="btn_undo">
          Undo
        </div>
        <div id="zoom-out-btn" class="button">
          -
        </div>
        <div id="zoom-in-btn" class="button">
          +
        </div>
      </div>
      <div id="search-bar" class="search-bar toolbar hidden">
        <input type="text" id="search-entry" class="search-entry"
          data-i18n-placeholder="placeholder_search"
          placeholder="search"></input>
      </div>
      <div id="notifications">
        <div id="search-count" class="search-count hidden"></div>
        <div id="marked-count" class="marked-count hidden"></div>
      </div>
    </div>
    <div id="tree-view">
      <ul id="tree-root" class="nodes root-nodes">
      </ul>
      <div id="hover-menu" class="hidden"></div>
    </div>
    <div id="bottom-area">
      <div id="details-box" class="hidden">
      </div>
      <div id="bottom-bar" class="toolbar">
        <div id="details-btn" class="button" data-i18n="btn_details">
          Details
        </div>
        <div id="backup-btn" class="button" data-i18n="btn_backup">
          Backup
        </div>
        <div id="options-btn" class="button" data-i18n="btn_options">
          Options
        </div>
        <div id="donate-btn" class="button" data-i18n="btn_donate">
          Donate
        </div>
        <div id="help-btn" class="button" data-i18n="btn_help">
          Help
        </div>
      </div>
      <div id="status-bar">
        <span id="status-text"></span>
      </div>
    </div>
    <img id="drag-arrow" src="/img/drag-arrow.png" style="display: none;" />
  </body>
</html>
