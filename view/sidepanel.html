<html>
  <head>
    <meta charset="UTF-8">
    <title>TK Tree Style Tab Outliner</title>
    <script type="module" src="./view.js"></script>
    <link id="theme-base" rel="stylesheet" type="text/css" href="/themes/tk.css"/>
    <link id="theme-variant" rel="stylesheet" type="text/css" href="/themes/tk-night.css"/>
    <link rel="stylesheet" type="text/css" href="./sidepanel.css"/>
    <style id="style-options" type="text/css"></style>
    <style id="user-styles" type="text/css"></style>
  </head>
  <body>
    <div id="top-bar" class="toolbar">
      <div id="view-scope-btn" class="button">
        Session
      </div>
      <div id="" class="button">
        B2
      </div>
      <div id="" class="button">
        B3
      </div>
      <div id="" class="button">
        B4
      </div>
      <div id="" class="button">
        B5
      </div>
    </div>
    <div id="tree-view">
      <ul id="tree-root" class="nodes root-nodes">
      </ul>
      <div id="marked-count" class="hidden"></div>
      <div id="hover-menu" class="hidden"></div>
    </div>
    <div id="details-box" class="hidden">
    </div>
    <div id="bottom-bar" class="toolbar">
      <div id="details-btn" class="button">
        Details
      </div>
      <div id="backup-btn" class="button">
        Backup
      </div>
      <div id="options-btn" class="button">
        Options
      </div>
      <div id="donate-btn" class="button">
        Donate
      </div>
      <div id="help-btn" class="button">
        Help
      </div>
      <!--<div id="reddit-btn" class="button">
        Support forum over on reddit, /r/TKTSTO or something like that
      </div>-->
      <!--<div id="github-btn" class="button">
        GitHub
      </div>-->
    </div>
    <div id="status-bar">
      <span id="status-text"></span>
    </div>
  </body>
</html>
